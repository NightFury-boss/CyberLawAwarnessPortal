# ==============================================================================
# Cyber Law Awareness Portal — Staging Docker Compose Configuration
# Orchestrates production-configured backend and frontend reverse-proxy containers
# ==============================================================================

version: '3.8'

services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: cyberlaw_backend_staging
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - TRUST_PROXY=1
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - CLIENT_URL=${CLIENT_URL:-http://localhost}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@cyberlawportal.test}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - RATE_LIMIT_AUTH_MAX=${RATE_LIMIT_AUTH_MAX:-20}
      - RATE_LIMIT_AUTH_WINDOW_MS=${RATE_LIMIT_AUTH_WINDOW_MS:-900000}
      - RATE_LIMIT_ASSISTANT_MAX=${RATE_LIMIT_ASSISTANT_MAX:-30}
      - RATE_LIMIT_ASSISTANT_WINDOW_MS=${RATE_LIMIT_ASSISTANT_WINDOW_MS:-60000}
      - SPACED_RETRIEVAL_DELAY_DAYS=${SPACED_RETRIEVAL_DELAY_DAYS:-7}
    expose:
      - "5000"
    networks:
      - staging_network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    container_name: cyberlaw_frontend_staging
    restart: unless-stopped
    ports:
      - "${STAGING_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - staging_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 15s
      timeout: 3s
      retries: 3

networks:
  staging_network:
    driver: bridge

